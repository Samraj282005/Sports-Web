services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: athletefund
      POSTGRES_USER: athletefund
      POSTGRES_PASSWORD: athletefund
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athletefund -d athletefund"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - athletefund_postgres:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      PORT: 3001
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: athletefund
      DATABASE_PASSWORD: athletefund
      DATABASE_NAME: athletefund
      FRONTEND_URL: http://localhost:5173
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  athletefund_postgres:
